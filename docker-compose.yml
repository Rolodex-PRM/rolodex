name: rolodex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rolodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolodex}
      POSTGRES_DB: ${POSTGRES_DB:-rolodex}
    ports:
      - "${POSTGRES_PORT:-5472}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6479}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rolodex}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rolodexsecret}
    ports:
      - "${S3_PORT:-9100}:9000"
      - "${S3_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data

  migrate:
    build: .
    command: pnpm --filter @rolodex/db migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rolodex}:${POSTGRES_PASSWORD:-rolodex}@postgres:5432/${POSTGRES_DB:-rolodex}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: pnpm --filter @rolodex/api start
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rolodex}:${POSTGRES_PASSWORD:-rolodex}@postgres:5432/${POSTGRES_DB:-rolodex}
      S3_ENDPOINT: http://minio:9000
      API_PORT: 3000
    ports:
      - "${API_PORT:-4100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  carddav:
    build: .
    command: pnpm --filter @rolodex/carddav start
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rolodex}:${POSTGRES_PASSWORD:-rolodex}@postgres:5432/${POSTGRES_DB:-rolodex}
      CARDDAV_PORT: 3001
      PUBLIC_CARDDAV_URL: ${PUBLIC_CARDDAV_URL:-http://localhost:4101}
    ports:
      - "${CARDDAV_PORT:-4101}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-4180}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
