name: rolodex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rolodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolodex}
      POSTGRES_DB: ${POSTGRES_DB:-rolodex}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5472}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rolodex}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rolodexsecret}
    ports:
      - "127.0.0.1:${S3_PORT:-9100}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data

  app:
    image: rolodex
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rolodex}:${POSTGRES_PASSWORD:-rolodex}@postgres:5432/${POSTGRES_DB:-rolodex}
      S3_ENDPOINT: http://minio:9000
      API_PORT: 3000
      CARDDAV_PORT: 3001
      PUBLIC_CARDDAV_URL: https://${PUBLIC_HOST:-localhost}:${CARDDAV_PORT:-4101}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      CARDDAV_TLS_CERT: /certs/fullchain.pem
      CARDDAV_TLS_KEY: /certs/privkey.pem
    ports:
      - "${API_PORT:-4100}:3000"
      - "${CARDDAV_PORT:-4101}:3001"
    volumes:
      - certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      WEB_TLS_PORT: ${WEB_TLS_PORT:-4443}
    ports:
      - "${WEB_PORT:-4180}:80"
      - "${WEB_TLS_PORT:-4443}:443"
    volumes:
      - certs:/certs:ro
    depends_on:
      - app

volumes:
  postgres-data:
  minio-data:
  certs:
