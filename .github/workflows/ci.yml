name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rolodex
          POSTGRES_PASSWORD: rolodex
          POSTGRES_DB: rolodex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolodex -d rolodex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rolodex:rolodex@localhost:5432/rolodex
      CREDENTIALS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

  # Native runners per arch. Cross-building arm64 under QEMU crashes pnpm with SIGILL.
  docker-platform:
    name: Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            node_arch: x64
            image_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            node_arch: arm64
            image_arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: rolodex:ci
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Assert image architecture
        run: |
          set -eux
          arch="$(docker image inspect rolodex:ci --format '{{.Architecture}}')"
          if [ "$arch" != "${{ matrix.image_arch }}" ]; then
            echo "::error::expected image architecture ${{ matrix.image_arch }}, got $arch"
            exit 1
          fi

      - name: Smoke-test native modules
        run: |
          set -eux
          docker run --rm --platform "${{ matrix.platform }}" rolodex:ci \
            node --input-type=module -e "
              import process from 'node:process';
              import { hash, verify } from '@node-rs/argon2';

              if (process.arch !== '${{ matrix.node_arch }}') {
                console.error('unexpected process.arch:', process.arch);
                process.exit(1);
              }

              const digest = await hash('rolodex-ci');
              if (!(await verify(digest, 'rolodex-ci'))) {
                console.error('argon2 verify failed');
                process.exit(1);
              }

              console.log('native smoke ok', process.arch, process.platform);
            "

  # Exact name required by branch protection.
  docker:
    name: Docker build
    needs: [docker-platform]
    runs-on: ubuntu-latest
    steps:
      - name: All platform Docker builds passed
        run: echo "linux/amd64 and linux/arm64 images built and smoke-tested."
