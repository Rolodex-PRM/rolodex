name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rolodex
          POSTGRES_PASSWORD: rolodex
          POSTGRES_DB: rolodex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolodex -d rolodex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rolodex:rolodex@localhost:5432/rolodex
      CREDENTIALS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=docker-multiarch
          cache-to: type=gha,mode=min,scope=docker-multiarch

      - name: Load amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: rolodex:ci-amd64
          cache-from: type=gha,scope=docker-multiarch

      - name: Load arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: rolodex:ci-arm64
          cache-from: type=gha,scope=docker-multiarch

      - name: Assert image architectures
        run: |
          set -eux
          amd64="$(docker image inspect rolodex:ci-amd64 --format '{{.Architecture}}')"
          arm64="$(docker image inspect rolodex:ci-arm64 --format '{{.Architecture}}')"
          [ "$amd64" = amd64 ]
          [ "$arm64" = arm64 ]

      - name: Smoke-test native modules on amd64 and arm64
        run: |
          set -eux
          smoke() {
            local platform="$1" tag="$2" expected_arch="$3"
            docker run --rm --platform "$platform" -e EXPECTED_ARCH="$expected_arch" "$tag" \
              node --input-type=module -e '
                import process from "node:process";
                import { hash, verify } from "@node-rs/argon2";
                if (process.arch !== process.env.EXPECTED_ARCH) {
                  console.error("unexpected process.arch:", process.arch);
                  process.exit(1);
                }
                const digest = await hash("rolodex-ci");
                if (!(await verify(digest, "rolodex-ci"))) process.exit(1);
                console.log("native smoke ok", process.arch, process.platform);
              '
          }
          smoke linux/amd64 rolodex:ci-amd64 x64
          smoke linux/arm64 rolodex:ci-arm64 arm64
