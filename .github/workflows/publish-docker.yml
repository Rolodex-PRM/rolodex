name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "release tags latest + semver; dev tags only gallinij/rolodex:dev"
        required: true
        type: choice
        options:
          - release
          - dev
        default: release
      version:
        description: "Semver for release channel (e.g. 1.0.0 or v1.0.0). Ignored for dev."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'release' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: gallinij/rolodex

jobs:
  # Build each arch on a native runner. QEMU arm64 hits SIGILL in pnpm install
  # (exit 132) when cross-building on ubuntu-latest.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Require version for release channel
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'release') }}
        run: |
          version='${{ inputs.version || github.event.release.tag_name }}'
          if [ -z "$version" ]; then
            echo '::error::version is required for the release channel (e.g. 0.2.1).'
            exit 1
          fi

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Rolodex
            org.opencontainers.image.description=Self-hosted people, calendar, and tasks

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'dev' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'dev' }}
            type=semver,pattern={{version}},value=${{ inputs.version || github.event.release.tag_name }},enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'release') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || github.event.release.tag_name }},enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'release') }}
            type=semver,pattern={{major}},value=${{ inputs.version || github.event.release.tag_name }},enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'release') }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'release') }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -eux
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
